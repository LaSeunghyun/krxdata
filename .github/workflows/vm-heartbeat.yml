# VM 생존 감시 (2026-11-12) - Oracle VM 이 통째로 멈추면 VM 스스로는 알릴 수 없다. 그래서 VM 밖(GitHub Actions)에서 본다.
# 판정: 거래일 09:10~20:00 KST 에 account_snapshots(VM 크론이 10분마다 씀) 마지막 기록이 30분 넘게 없으면 텔레그램 경보.
# 같은 장애로 20분마다 울리지 않게, 30분 넘은 첫 회와 그 뒤 2시간마다만 보낸다(상태 저장 없이 경과 시간 창으로 판정).
# 휴장일은 네이버 KOSPI 지수의 마지막 체결 날짜가 오늘이 아니면 건너뛴다.
# 수동 시험: Actions 탭에서 Run workflow, test=true 면 시험 메시지만 보낸다.
name: VM 생존 감시

on:
  schedule:
    - cron: '*/20 0-11 * * 1-5'   # UTC = KST 09:00~20:59 평일
  workflow_dispatch:
    inputs:
      test:
        description: '시험 메시지만 보내기'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          KEY: ${{ secrets.SUPABASE_MANAGEMENT_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ inputs.test }}
        run: |
          set -u
          send() {
            curl -s -m 20 -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg c "$TG_CHAT" --arg t "$1" '{chat_id:$c,text:$t}')" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" | jq -r '.ok'
          }
          if [ "${TEST:-false}" = "true" ]; then
            send "🔔 VM 생존 감시 시험: GitHub Actions 에서 보냈습니다. VM 이 30분 넘게 멈추면 이 경로로 알립니다."
            exit 0
          fi
          hm=$(TZ=Asia/Seoul date +%H%M); today=$(TZ=Asia/Seoul date +%F)
          if [ "$hm" -lt 0910 ] || [ "$hm" -gt 2000 ]; then echo "감시 시간 밖 $hm"; exit 0; fi
          idx=$(curl -s -m 10 -A 'Mozilla/5.0' https://polling.finance.naver.com/api/realtime/domestic/index/KOSPI | jq -r '.datas[0].localTradedAt // empty')
          case "$idx" in "$today"*) ;; *) echo "휴장일로 판단(지수 마지막 체결 $idx)"; exit 0;; esac
          q='{"query":"select extract(epoch from now()-max(ts))::int as age, to_char(max(ts) at time zone '"'"'Asia/Seoul'"'"', '"'"'HH24:MI'"'"') as last from account_snapshots"}'
          res=$(curl -s -m 30 -X POST "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${KEY}" -H 'Content-Type: application/json' -H 'User-Agent: Mozilla/5.0' -d "$q")
          age=$(echo "$res" | jq -r '.[0].age // empty' 2>/dev/null)
          last=$(echo "$res" | jq -r '.[0].last // empty' 2>/dev/null)
          if [ -z "$age" ]; then echo "DB 조회 실패: ${res:0:200}"; exit 1; fi
          echo "마지막 계좌 기록 $last KST, ${age}초 전"
          if [ "$age" -ge 1800 ] && [ $(( (age - 1800) % 7200 )) -lt 1200 ]; then
            send "🚨 VM 응답 없음: 마지막 계좌 기록 ${last} KST ($(( age / 60 ))분 전). 자동매매·손절·알림이 멈췄을 수 있습니다. 토스 앱에서 보유 종목을 확인하고, Oracle 콘솔에서 VM 을 재시작하세요."
          fi
