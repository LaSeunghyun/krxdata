name: KRXDATA Weekly Scoring

# 점수 재생성(score-kospi-full / score-kosdaq: DART + 공공데이터, LLM 없음) + 종목 마스터 + sector_stats.
# 토스 API 를 쓰지 않는다(GHA IP 는 토스에서 403). 2026-07-13 이후 수동 실행 기록만 있어 정기화(2026-10-01).
# 토요일 12:00 KST: 장외이고 stock-live 가 매매하지 않는 시간. current_price·market_cap_tril 은 --keep-price 로 보존
# (stock-live 후보 필터 입력이며 daily-ranking 이 매일 04:00 KST 에 Toss 값으로 갱신한다).
on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

jobs:
  scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      # 점수 스크립트는 PostgREST 쓰기에 service key 가 필요하다. 전용 시크릿이 없으면 SUPABASE_KEY 로 대체한다(권한은 사전 점검 단계가 검증).
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SUPABASE_MANAGEMENT_KEY: ${{ secrets.SUPABASE_MANAGEMENT_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install

      - name: Preflight - 쓰기 권한 확인 (실패 시 즉시 중단)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/stock_analysis" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates,return=minimal" -d '[]')
          echo "PostgREST 쓰기 사전 점검 HTTP $code"
          [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]

      - name: 종목 마스터 + 점수 입력 목록
        run: node refresh-master.mjs --stocks

      - name: KOSPI 점수
        run: node score-kospi-full.js --all --keep-price

      - name: KOSDAQ 점수
        run: node score-kosdaq.js --all --keep-price

      - name: sector_stats 재계산
        run: node refresh-master.mjs --sector-stats

      - name: 요약
        if: always()
        run: |
          echo "### 주간 점수 재생성" >> $GITHUB_STEP_SUMMARY
          echo "- 완료 시각: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')" >> $GITHUB_STEP_SUMMARY
